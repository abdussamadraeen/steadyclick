<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1e2638 0%, #0a0d14 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .icon-container {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0071e3 0%, #6366f1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 113, 227, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .icon-container svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    p {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .tags {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 3px 9px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>
  <h1>SteadyClick</h1>
  <p>Universal Web Accessibility & Tremor Mouse</p>
  <div class="tags">
    <span class="tag">Steady Pointer</span>
    <span class="tag">Magnetic Click</span>
    <span class="tag">High Contrast</span>
  </div>
</body>
</html>
